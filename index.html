<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <style>
    :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --accent: #2563eb; --border: #e3e6eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171c; --card: #1d2128; --text: #e7e9ee; --muted: #9aa1ad; --accent: #60a5fa; --border: #2c313a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 480px; margin: 48px auto; padding: 0 16px; }
    h1 { margin: 0 0 16px; font-size: 1.6rem; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    li button { background: none; color: var(--muted); padding: 2px 6px; }
    .empty { color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>To-Do List</h1>
    <form id="add">
      <input type="text" id="text" placeholder="What needs doing?" autocomplete="off" required>
      <button>Add</button>
    </form>
    <ul id="list"></ul>
    <p class="empty" id="empty">Nothing yet. Saved in this browser only.</p>
  </main>
  <script>
    const KEY = 'todos';
    let todos = [];
    try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}

    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {} };

    function render() {
      const list = document.getElementById('list');
      list.innerHTML = '';
      todos.forEach((t, i) => {
        const li = document.createElement('li');
        li.className = t.done ? 'done' : '';
        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = t.done;
        box.onchange = () => { t.done = box.checked; save(); render(); };
        const span = document.createElement('span');
        span.textContent = t.text;
        const del = document.createElement('button');
        del.textContent = '✕';
        del.title = 'Delete';
        del.onclick = () => { todos.splice(i, 1); save(); render(); };
        li.append(box, span, del);
        list.append(li);
      });
      document.getElementById('empty').hidden = todos.length > 0;
    }

    document.getElementById('add').onsubmit = e => {
      e.preventDefault();
      const input = document.getElementById('text');
      todos.push({ text: input.value.trim(), done: false });
      input.value = '';
      save();
      render();
    };

    render();
  </script>
</body>
</html>
